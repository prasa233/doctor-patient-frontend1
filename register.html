<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HealthCare - Register</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="left-section">

<img 
        src="hospial.jpg" 
        alt="Hospital Logo" 
        class="hospital-logo"
    >


        <h1>HealthCare</h1>

        <p>
            Join our healthcare platform
        </p>

        <span>
            Register as a doctor or patient.
        </span>

    </div>


    <div class="right-section">

        <div class="form-box">

            <h2>Create Account</h2>

            <p class="subtitle">
                Register a new account
            </p>


            <form id="registerForm">

                <label>Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >


                <label>Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>Phone</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    required
                >


                <label>Register As</label>

                <select id="role" required>

                    <option value="">
                        Select role
                    </option>

                    <option value="doctor">
                        Doctor
                    </option>

                    <option value="patient">
                        Patient
                    </option>

                </select>


                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    required
                >


                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >


                <button type="submit">
                    Register
                </button>

            </form>


            <p class="bottom-text">

                Already have an account?

                <a href="index.html">
                    Login
                </a>

            </p>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
